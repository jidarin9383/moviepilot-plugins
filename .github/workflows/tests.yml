name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/v3/publicbt -q
      - run: python -m unittest discover -s tests/v3/cloudshare -q
  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: swiftc -O deploy/quark_dispatch.swift -o /tmp/cloudshare-dispatch
